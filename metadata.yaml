desc: E-Hentai / ExHentai 随机抽卡插件（三次元可混入 16K 和哔咔 Cosplay 的随机图），风格（二次元/三次元）× 分级（擦边/R18）组合成 4 个画廊池，随机抽画廊再随机取一页；支持中文关键词与随机角色（EhTagTranslation 标签库），支持合并转发 / 图文混合、多图源并发、按图集抽取（每个画廊抽几张）与回复图片获取整本 PDF，R18 仅私聊并做未成年内容过滤。
